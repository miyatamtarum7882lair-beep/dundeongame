version: v4-proposal
principle: 攻撃を繰り返し受けると無害な予兆→一時発症→永続デバフへ。故意に弱点をさらすと進行が加速する。
buildup:
  0-2: 予兆だけ。基礎攻撃に別の威力がない場合、MP減少・行動不能・魅了などの実害なし。蓄積ゲージだけ増える。
  3-4: 前兆。軽い一時デバフ、対応を学べる段階。
  5-6: 発症。状態異常が明確になり拘束コンボが成立。発症中の再命中は効果時間の延長を優先。
  7+: 危険域。自発的受容または繰り返しの発症・敗北で永続デバフ段階Iが定着。単発の不意打ちでは永続化しない。
permanent:
  normalRoute: 異なる遭遇で発症を3回繰り返した後、永続段階Iが定着（初回は明瞭な警告）。
  voluntaryRoute: 危険域で自発的に攻撃を受け入れる選択をした場合、段階Iへの定着を早める。単一戦闘での繰り返し入力は制限。
  stageCap: 段階I～IV、段階的悪化。既存v3の難しいが可能な解除試練を維持。
  recovery: まず蓄積・発症を解除し、永続デバフは専用試練・素材・再戦等で1段階ずつ回復。
balance:
  warning: 蓄積3、5、7到達時に視覚・音・テキストで予告。初撃は実害ゼロでもゲージ上昇は表示する。
  counterplay: 射線を切る、解除行動、距離を取る、敵の予備動作を避けるなど必ず2経路以上。
  controlLimit: 魅了・睡眠・行動不能は1度ごとに継続上限。解除直後には短い再発防止猶予を設け、無限拘束を禁止。
  growth: 敵個体成長は0～3段階。永続デバフの悪化と加算し上限を設ける。成長と状態異常倍率の無制限乗算禁止。
  exp: 直接EXPドレインとMP0フィニッシュEXP吸収はいずれも共通のレベル漏れ癖を進行させる。
