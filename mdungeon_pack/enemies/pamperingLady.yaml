  temptation:
    playerChoice: 甘やかしに頼り続ける／自分から抵抗をやめる
    spiral: 自発的に頼るほど次回も依存しやすくなる
    cost: 提案：自発的な不利行動により一時デバフを強化。繰り返すと条件つき永続デバフと敵個体強化につながる
