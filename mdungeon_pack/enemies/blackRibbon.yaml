id: blackRibbon
name: 黒髪リボンちゃん
attr: 口
rank: basic
concept: 桃色の吐息で魅了を重ねるお姉さん
appearance:
  summary: 黒紫色の編み込みツインテール、紫の瞳、ピンクのリボンと黒衣装の成人女性。
  charmPoint: 唇と胸元。吐息演出を主軸に胸元は補助。
personality:
  archetype: 余裕のある甘い声のお姉さん
  traits:
  - 落ち着いた話し方
  - 吐息魔法に自信
  - 抵抗する相手にも優しく笑う
  speech:
    firstPerson: わたし
    heroCall: キミ
    tone: 柔らかくゆっくりしたお姉さん口調。
    endings:
    - ～だよ♡
    - ～でしょ？
    avoid:
    - 幼児語
  sampleLines:
    encounter: 少し遊んでいかない？
    bind: はい、つかまえた♡
    drain: 吐息、効いてきた？
    familiar: 前より弱くなったみたいね
    rememberUse: またこの吐息で動けなくなったね
    defeat: 経験値もいただいちゃった♡
behavior:
  style: 吐息で桃色酔いを蓄積、魅了発症時に接近拘束。
  drainFeel: 霧のような持続吸収。
skills:
  normal:
    name: リボンタッチ
    note: 軽い近接攻撃。
    evolution:
      conditionType: repeated_use
      condition: 「リボンタッチ」で累積命中が基準に到達
      scope: 敵個体ごとに永続・技単位
      evolvedName: リボンタッチ・改
      upgradedEffect: 固有状態異常への連携を強化
