  bind:
    name: 桃色吐息ホールド
    note: 上下左右の隣接から予備動作後に拘束し、MPを継続吸収。MP0フィニッシュで大量経験値ドレインと敵強化。
    evolution:
      conditionType: finish
      condition: 「桃色吐息ホールド」でMP0フィニッシュに成功
      scope: 敵個体ごとに永続・技単位
      evolvedName: 桃色吐息ホールド・改
      upgradedEffect: MP吸収・拘束の強化
      counterplay: 予備動作・回避・解除を維持
      status: 提案
  specials:
